name: Deploy Function

on:
  push:
    branches: [main]
    paths:
      - 'function_app.py'
      - 'modules/**'
      - 'requirements.txt'
      - 'host.json'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install dependencies (Bullseye container for GLIBC 2.31 compatibility)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            python:3.11-slim-bullseye \
            pip install \
              --target="/workspace/.python_packages/lib/site-packages" \
              --upgrade \
              -r /workspace/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: '.'
          scm-do-build-during-deployment: false

# ── Required GitHub Actions secrets ─────────────────────────────────────────
# AZURE_CLIENT_ID          — same SP used by deploy-infra.yml
# AZURE_TENANT_ID
# AZURE_SUBSCRIPTION_ID
# AZURE_FUNCTION_APP_NAME  — output from the infra deployment (e.g. scim-pat-func)
